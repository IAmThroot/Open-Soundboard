name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test + lint (windows msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Tests
        run: cargo test --locked
      - name: Fmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  installer:
    name: installer script builds
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $isccPath = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (!(Test-Path $isccPath)) {
            $isccPath = "$env:ProgramFiles\Inno Setup 6"
          }
          Write-Host "Adding $isccPath to PATH"
          echo $isccPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build the release binary the installer packages
        run: cargo build --locked --release
      - name: Compile installer
        shell: pwsh
        run: |
          $toml = Get-Content Cargo.toml -Raw
          if ($toml -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "version not found in Cargo.toml" }
          $env:APP_VERSION = $Matches[1]
          "APP_VERSION=$env:APP_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          iscc "/DMyAppVersion=$env:APP_VERSION" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSoundboard-installer-smoke
          path: dist/OpenSoundboard-Setup-*.exe
          if-no-files-found: error